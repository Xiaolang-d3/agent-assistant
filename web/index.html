<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="mast">
        <div>
          <p class="eyebrow">Desk intercom</p>
          <h1>Agent Assistant</h1>
        </div>
        <p id="status" class="status">正在检查配置…</p>
      </header>

      <main id="log" class="log" aria-live="polite">
        <article class="bubble system">
          <p>按住铜色按钮说话，或直接打字。需要查证的问题，我会先上网再回答。</p>
        </article>
      </main>

      <form id="composer" class="composer">
        <textarea
          id="input"
          rows="2"
          placeholder="问一件需要查的事，或按住说话"
          autocomplete="off"
        ></textarea>
        <div class="actions">
          <button type="button" id="talk" class="talk" aria-pressed="false">
            <span class="talk-orb"></span>
            <span id="talk-label">按住说话</span>
          </button>
          <button type="submit" id="send" class="send">发送</button>
        </div>
      </form>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
